<body style="font-family:sans-serif;max-width:40em;margin:2em auto">
  <h1>Recipient Guard</h1>
  <p>Outlook add-in that warns before sending to flagged recipients.</p>
  <p>Install: download <a href="manifest.xml">manifest.xml</a>, then in Outlook use
    <em>Add-ins → My add-ins → Add a custom add-in → Add from File</em>.</p>
  <p>Docs and source: <a href="https://github.com/Lichens-Innovation/outlook-recipient-guard">GitHub</a>.</p>
</body>
