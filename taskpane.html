<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recipient Guard</title>
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script type="text/javascript" src="launchevent.js"></script>
  <style>
    body { font: 14px/1.4 "Segoe UI", -apple-system, sans-serif; margin: 12px; color: #1f2328; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    label { display: block; font-weight: 600; margin: 12px 0 4px; }
    textarea, input[type=text] { width: 100%; box-sizing: border-box; font: 13px ui-monospace, Menlo, monospace; padding: 6px; border: 1px solid #c4c4c4; border-radius: 4px; }
    textarea { height: 180px; }
    .hint { color: #59636e; font-size: 12px; margin-top: 4px; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
    button { background: #2563eb; color: #fff; border: 0; border-radius: 4px; padding: 6px 14px; cursor: pointer; }
    button.secondary { background: #e5e7eb; color: #1f2328; }
    #status { font-size: 12px; margin-top: 8px; min-height: 1em; }
    .ok { color: #1a7f37; } .err { color: #cf222e; }
    pre { background: #f6f8fa; padding: 6px; white-space: pre-wrap; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Recipient Guard</h1>
  <div class="hint">Alerte avant l'envoi si un destinataire correspond à une règle.</div>

  <label for="rules">Règles (une par ligne)</label>
  <textarea id="rules" spellcheck="false" placeholder="jean.tremblay@gmail.com | Adresse perso de Jean&#10;@ancien-client.com | Ancien client&#10;andre*@gmail.com"></textarea>
  <div class="hint">Adresse exacte, <code>@domaine.com</code>, jokers <code>*</code>, <code># commentaire</code>, <code>| raison</code>.</div>

  <div class="row">
    <input type="checkbox" id="warnExternal" />
    <label for="warnExternal" style="margin:0;font-weight:400">Alerter aussi pour tout destinataire externe</label>
  </div>
  <label for="internalDomains">Domaines internes</label>
  <input type="text" id="internalDomains" placeholder="lichens.ai" />

  <div class="row">
    <button id="save">Enregistrer</button>
    <button id="test" class="secondary">Tester ce brouillon</button>
  </div>
  <div id="status"></div>
  <pre id="result" hidden></pre>

  <script>
    function $(id) { return document.getElementById(id); }
    function setStatus(text, cls) { var s = $("status"); s.textContent = text; s.className = cls || ""; }
    function readForm() {
      return {
        rules: $("rules").value,
        warnExternal: $("warnExternal").checked,
        internalDomains: $("internalDomains").value
      };
    }

    Office.onReady(function () {
      var cfg = rgLoadConfig();
      $("rules").value = cfg.rules;
      $("warnExternal").checked = !!cfg.warnExternal;
      $("internalDomains").value = cfg.internalDomains;

      $("save").onclick = function () {
        try { rgParseRules($("rules").value); }
        catch (e) { return setStatus("Règle invalide : " + e.message, "err"); }
        Office.context.roamingSettings.set(RG_SETTINGS_KEY, readForm());
        Office.context.roamingSettings.saveAsync(function (r) {
          if (r.status === Office.AsyncResultStatus.Succeeded) setStatus("Enregistré.", "ok");
          else setStatus("Échec : " + r.error.message, "err");
        });
      };

      $("test").onclick = function () {
        var item = Office.context.mailbox.item;
        var fields = [item.to, item.cc, item.bcc];
        Promise.all(fields.map(function (f) {
          return new Promise(function (res) {
            if (!f || !f.getAsync) return res([]);
            f.getAsync(function (r) { res(r.status === "succeeded" ? r.value : []); });
          });
        })).then(function (lists) {
          var hits = rgFindMatches(lists[0].concat(lists[1], lists[2]), readForm());
          var out = $("result"); out.hidden = false;
          out.textContent = hits.length
            ? "⚠ " + hits.map(function (h) { return h.address + "  (" + h.why + ")"; }).join("\n⚠ ")
            : "Aucun destinataire signalé.";
        });
      };
    });
  </script>
</body>
</html>
